services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.48.0
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: UTC
      TZ: UTC
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_HIRING_BANNER_ENABLED: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_ENCRYPTION_KEY: decision-workbench-local-demo-key
      N8N_INSTANCE_OWNER_MANAGED_BY_ENV: "true"
      N8N_INSTANCE_OWNER_EMAIL: demo.owner@example.com
      N8N_INSTANCE_OWNER_FIRST_NAME: Demo
      N8N_INSTANCE_OWNER_LAST_NAME: Owner
      # Bcrypt hash of the local demo password DecisionDemo123!
      N8N_INSTANCE_OWNER_PASSWORD_HASH: "$$2b$$10$$Fl9GBZsESKHymaKJXIPDI.PHeC6VESTKsJa72o5FzT8PJ93R9Mp9q"
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-meta/llama-3.3-70b-instruct}
      DECISION_LLM_MODE: ${DECISION_LLM_MODE:-auto}
      DECISION_AUDIT_DIR: /home/node/decision-audit
    volumes:
      - n8n_data:/home/node/.n8n
      - ./audit-log:/home/node/decision-audit
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:5678/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  n8n_data:
